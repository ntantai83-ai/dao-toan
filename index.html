<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Đảo Toán">
<title>Đảo Toán</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{margin:0;padding:0;background:#f2f5fb;color:#1d2433;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:880px;margin:0 auto;padding:14px 14px 48px}
[data-act]{cursor:pointer}
.top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:14px}
.hello{font-size:26px;font-weight:800;margin:6px 0}
.badges span{display:inline-block;background:#fff;border-radius:20px;padding:7px 13px;margin:4px 0 4px 8px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,40,80,.08)}
.h1{font-size:26px;font-weight:800;margin:6px 0 10px}
.h2{font-size:19px;font-weight:800;margin:0 0 10px}
.muted{color:#6b7488;font-size:15px;margin:4px 0}
.small{display:inline-block;color:#4f7cff;font-weight:700;font-size:16px;margin-top:12px}
.center{text-align:center}
.goal{background:#fff7e0;border:2px dashed #f5b400;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.mission{font-size:18px;margin:6px 0}
.tiles{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -7px}
.tile{width:calc(50% - 14px);margin:7px;border-radius:22px;padding:22px 18px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ti{font-size:52px}.tt{font-size:26px;font-weight:800;margin-top:6px}.ts{opacity:.9;margin-top:4px}
.parent{margin-top:22px;text-align:center;color:#6b7488;font-weight:700;padding:12px}
.btn{display:inline-block;border-radius:14px;padding:14px 22px;margin:6px;font-size:18px;font-weight:800;color:#fff;background:#4f7cff}
.btn.ghost{background:#eef2fb;color:#1d2433}
.btn.red{background:#ef6b6b}.btn.green{background:#10b981}
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:12px}
.back{font-size:18px;font-weight:800;padding:8px 12px 8px 0;color:#4f7cff}
.bt{-webkit-flex:1;flex:1;font-size:19px;font-weight:800;margin-left:6px}
.pill{display:inline-block;border-radius:20px;padding:8px 13px;margin:4px;background:#e7ecf6;font-weight:700;font-size:15px}
.pill.on{background:#1d2433;color:#fff}
.langrow{margin-bottom:12px}
.lv{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,40,80,.08)}
.lv.locked{opacity:.5}
.lvi{font-size:40px;width:58px}.lvb{-webkit-flex:1;flex:1}.lvn{font-size:19px;font-weight:800}.lvs{font-size:20px;white-space:nowrap}
.prog{height:12px;background:#e3e8f2;border-radius:8px;overflow:hidden;margin:4px 0 6px}
.prog div{height:100%;border-radius:8px}
.q{font-size:25px;line-height:1.6}
.vi{font-size:18px;color:#6b7488;margin-top:10px;line-height:1.5}
.opts{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -6px}
.opt{width:calc(50% - 12px);margin:6px;background:#fff;border:3px solid #dfe5f0;border-radius:16px;padding:16px 10px;text-align:center;font-size:23px;line-height:1.5;min-height:76px}
.opt.ok{border-color:#10b981;background:#e6f8f0}
.opt.bad{border-color:#ef4444;background:#fdeaea}
.opt.dim{opacity:.55}
.fb{border-radius:16px;padding:14px 16px;margin:12px 0}
.fb.good{background:#e6f8f0}.fb.badfb{background:#fff1e6}
.fbt{font-size:21px;font-weight:800}
.steps{margin:10px 0 4px;padding-left:24px;font-size:19px;line-height:1.75}
.steps li{margin-bottom:6px}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}
.fr>span{display:block;padding:0 3px}
.fr>.b{border-top:2px solid currentColor}
.box{display:inline-block;border:2px dashed #9aa6c0;border-radius:8px;padding:0 12px;color:#9aa6c0}
sup{font-size:.62em}
.fcard{background:#fff;border-radius:24px;min-height:250px;padding:30px 20px;text-align:center;box-shadow:0 4px 18px rgba(20,40,80,.12);margin-bottom:14px}
.fw{font-size:44px;font-weight:800;margin:16px 0 10px}
.fm{font-size:30px;font-weight:700;color:#10b981;margin:8px 0}
.fe{font-size:20px;color:#4a5368;font-style:italic;margin-top:10px}
.big{font-size:70px}
.res{font-size:56px;margin:8px 0}
.inp{font-size:22px;padding:12px 14px;border:2px solid #dfe5f0;border-radius:12px;width:100%;max-width:340px;margin:6px 0;-webkit-appearance:none}
.av{display:inline-block;font-size:38px;padding:6px 8px;margin:3px;border-radius:14px;border:3px solid transparent}
.av.on{border-color:#1d2433;background:#eef2fb}
.cl{display:inline-block;width:44px;height:44px;border-radius:50%;margin:5px;border:4px solid #fff;box-shadow:0 0 0 2px #dfe5f0}
.cl.on{box-shadow:0 0 0 3px #1d2433}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid #edf0f6;vertical-align:middle}
.barrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:5px 0;font-size:15px}
.barrow .lbl{width:64px}.barrow .trk{-webkit-flex:1;flex:1;height:16px;background:#eef2fb;border-radius:8px;overflow:hidden;margin:0 8px}
.barrow .trk div{height:100%}
.wq{border-bottom:1px solid #edf0f6;padding:10px 0;font-size:17px;line-height:1.6}
.pop{-webkit-animation:pop .5s ease;animation:pop .5s ease}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.5)}70%{-webkit-transform:scale(1.15)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (max-width:560px){.tile{width:calc(100% - 14px)}.opt{width:calc(100% - 12px)}.q{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var KEY='daotoan_v1', MINUS='−';
var COLORS=['#4f7cff','#ff5c8a','#8b5cf6','#10b981','#f59e0b'];
var AVATARS=['🦊','🐱','🐼','🐰','🦄','🐶','🐧','🐯'];
var PRAISE=['🎉 Chính xác!','👏 Giỏi quá!','🌟 Tuyệt vời!','✅ Đúng rồi!','💯 Quá đỉnh!'];
var INT=[0,1,2,4,7,14];
var app=document.getElementById('app');
var S,Q,V,P={};

/* ---------- lưu trữ ---------- */
function defState(){return {name:'',avatar:'🦊',color:'#4f7cff',levels:{},xp:0,days:{},daily:{},time:{},wrong:[],ts:{},vocab:{},lang:'vi',goal:'',pin:''};}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):defState();}catch(e){S=defState();}
  var d=defState();for(var k in d){if(!(k in S))S[k]=d[k];}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function pad(n){return (n<10?'0':'')+n;}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dkey(new Date());}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return dkey(d);}
function streak(){var n=0,d=new Date();if(!S.days[dkey(d)])d.setDate(d.getDate()-1);
  while(S.days[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function markDay(kind){var t=today();S.days[t]=1;S.daily[t]=S.daily[t]||{};S.daily[t][kind]=true;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- toán: phân số ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function lcm(a,b){return a/gcd(a,b)*b;}
function F(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function add(a,b){return F(a.n*b.d+b.n*a.d,a.d*b.d);}
function sub(a,b){return F(a.n*b.d-b.n*a.d,a.d*b.d);}
function mul(a,b){return F(a.n*b.n,a.d*b.d);}
function dvd(a,b){return F(a.n*b.d,a.d*b.n);}
function neg(a){return F(-a.n,a.d);}
function inv(a){return F(a.d,a.n);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rf(maxD){var x;do{x=F(ri(-9,9),ri(2,maxD||9));}while(x.n===0||x.d===1);return x;}
function num(v){return v<0?MINUS+(-v):''+v;}
function par(v){return v<0?'('+num(v)+')':num(v);}
function fh(n,d){var s=n<0?MINUS:'';n=Math.abs(n);if(d===1)return s+n;
  return s+'<span class="fr"><span class="t">'+n+'</span><span class="b">'+d+'</span></span>';}
function H(x){return fh(x.n,x.d);}
function HP(x){return x.n<0?'('+H(x)+')':H(x);}
function key(x){return x.n+'/'+x.d;}
function fi(x){return x?{k:key(x),h:H(x)}:null;}
function powH(x,e){return '('+H(x)+')<sup>'+e+'</sup>';}
function dec(t){var s=t<0?MINUS:'';t=Math.abs(t);var i=Math.floor(t/10),f=t%10;return s+i+(f?'{,}'+f:'');}
function mkOpts(ansItem,cands,filler){
  var list=[ansItem],seen={};seen[ansItem.k]=1;
  for(var i=0;i<cands.length&&list.length<4;i++){var c=cands[i];if(c&&!seen[c.k]){seen[c.k]=1;list.push(c);}}
  var guard=0;while(list.length<4&&filler&&guard<80){guard++;var f=filler();if(!seen[f.k]){seen[f.k]=1;list.push(f);}}
  shuffle(list);var idx=0;for(var j=0;j<list.length;j++)if(list[j].k===ansItem.k)idx=j;
  return {opts:list.map(function(o){return o.h;}),ans:idx};}
function fracFiller(a){return function(){return fi(F(a.n+pick([-3,-2,-1,1,2,3]),a.d*pick([1,1,2])));};}
function addCalc(a,b,plus){
  var m=lcm(a.d,b.d),p=a.n*(m/a.d),q=b.n*(m/b.d),t=plus?p+q:p-q,r=F(t,m),op=plus?' + ':' − ',s=[];
  if(a.d!==b.d)s.push('Quy đồng mẫu, mẫu chung là '+m+': &nbsp;'+H(a)+' = '+fh(p,m)+'; &nbsp;'+H(b)+' = '+fh(q,m)+'.');
  s.push(H(a)+op+HP(b)+' = '+fh(p,m)+op+(q<0?'('+fh(q,m)+')':fh(q,m))+' = '+fh(t,m)+(key(r)!==t+'/'+m?' = '+H(r):'')+'.');
  if(t!==0&&gcd(t,m)>1)s.push('(Đã rút gọn: chia cả tử và mẫu cho '+gcd(t,m)+'.)');
  return {s:s,r:r};}
var SIGN='Quy tắc dấu: (+)·(+) = (+); &nbsp;(−)·(−) = (+); &nbsp;(+)·(−) = (−).';

/* ---------- các dạng bài (sinh ngẫu nhiên) ---------- */
function gSimplify(){
  var x=rf(7),k=ri(2,6),rn=x.n*k,rd=x.d*k,raw=fh(rn,rd);
  var c=[fi(F(x.n,x.d*k)),fi(neg(x)),fi(F(x.d,x.n)),fi(F(x.n+(x.n>0?1:-1),x.d))];
  var o=mkOpts(fi(x),c,fracFiller(x));
  return {topic:'Rút gọn số hữu tỉ',vi:'Rút gọn phân số '+raw+' về dạng tối giản:',en:'Simplify '+raw+' to lowest terms:',opts:o.opts,ans:o.ans,
    steps:['Tìm ƯCLN của tử và mẫu: ƯCLN('+Math.abs(rn)+', '+rd+') = '+k+'.','Chia cả tử và mẫu cho '+k+': &nbsp;'+raw+' = '+H(x)+'.','Đáp án: <b>'+H(x)+'</b>.'],_v:x,_raw:[rn,rd]};}
function gCompare(){
  var a=rf(9),b,bn,bd,eqc=Math.random()<0.2;
  if(eqc){var k=ri(2,4);bn=a.n*k;bd=a.d*k;b=a;}else{do{b=rf(9);}while(key(b)===key(a));bn=b.n;bd=b.d;}
  var m=lcm(a.d,bd),p=a.n*(m/a.d),q=bn*(m/bd),sym=p<q?'&lt;':(p>q?'&gt;':'='),syms=['&lt;','&gt;','='];
  var bh=fh(bn,bd);
  return {topic:'So sánh số hữu tỉ',vi:'Chọn dấu đúng: &nbsp;'+H(a)+' <span class="box">?</span> '+bh,en:'Choose the correct sign: &nbsp;'+H(a)+' <span class="box">?</span> '+bh,opts:syms,ans:syms.indexOf(sym),
    steps:['Quy đồng mẫu (mẫu dương), mẫu chung là '+m+'.',H(a)+' = '+fh(p,m)+'; &nbsp;'+bh+' = '+fh(q,m)+'.','So sánh tử số: '+num(p)+' '+sym+' '+num(q)+', nên '+H(a)+' <b>'+sym+'</b> '+bh+'.'],_p:[a,F(bn,bd)]};}
function gOpp(){
  var x=rf(9),r=neg(x),o=mkOpts(fi(r),[fi(x),fi(inv(x)),fi(neg(inv(x)))],fracFiller(r));
  return {topic:'Số đối',vi:'Số đối của '+H(x)+' là:',en:'The opposite of '+H(x)+' is:',opts:o.opts,ans:o.ans,
    steps:['Hai số đối nhau có tổng bằng 0: giữ nguyên phần số, đổi dấu.','Số đối của '+H(x)+' là <b>'+H(r)+'</b>.','Kiểm tra: '+H(x)+' + '+HP(r)+' = 0 ✓'],_v:r};}
function gAdd(){
  var a=rf(9),b=rf(9),plus=Math.random()<0.5,cal=addCalc(a,b,plus),r=cal.r,expr=H(a)+(plus?' + ':' − ')+HP(b);
  var c=[fi(F(plus?a.n+b.n:a.n-b.n,a.d+b.d)),fi(plus?sub(a,b):add(a,b)),fi(neg(r)),fi(F(r.n+1,r.d))];
  var o=mkOpts(fi(r),c,fracFiller(r));
  var st=cal.s.slice();
  if(!plus&&b.n<0)st.unshift('Trừ một số âm là cộng với số đối của nó.');
  st.push('Đáp án: <b>'+H(r)+'</b>.');
  return {topic:'Cộng, trừ phân số',vi:'Tính: &nbsp;'+expr,en:'Calculate: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:st,_v:r};}
function gDec(){
  var p=ri(-99,99),q=ri(-99,99);if(p===0)p=7;if(q===0)q=-3;
  var plus=Math.random()<0.5,t=plus?p+q:p-q,expr=dec(p)+(plus?' + ':' − ')+(q<0?'('+dec(q)+')':dec(q));
  function di(v){return {k:'d'+v,h:dec(v)};}
  var o=mkOpts(di(t),[di(plus?p-q:p+q),di(-t),di(t+10)],function(){return di(t+pick([-20,-11,-2,2,11,20]));});
  var rw=dec(p)+((plus&&q>=0)||(!plus&&q<0)?' + ':' − ')+dec(Math.abs(q));
  return {topic:'Cộng, trừ số thập phân',vi:'Tính: &nbsp;'+expr,en:'Calculate: &nbsp;'+expr,opts:o.opts,ans:o.ans,
    steps:['Mẹo: cộng số âm = trừ số dương; trừ số âm = cộng số dương.','Viết lại: '+expr+' = '+rw+'.','Hai số khác dấu: lấy số lớn trừ số nhỏ (bỏ dấu), giữ dấu của số có phần số lớn hơn.','Kết quả: <b>'+dec(t)+'</b>.'],_d:[p,q,plus,t]};}
function gMul(){
  var a=rf(9),b=rf(9),r=mul(a,b),rn=a.n*b.n,rd=a.d*b.d,expr=H(a)+' · '+HP(b);
  var o=mkOpts(fi(r),[fi(dvd(a,b)),fi(neg(r)),fi(F(a.n+b.n,a.d*b.d))],fracFiller(r));
  var st=['Nhân tử với tử, mẫu với mẫu.',expr+' = '+fh(rn,rd)+(gcd(rn,rd)>1?' = '+H(r):'')+'.',SIGN,'Đáp án: <b>'+H(r)+'</b>.'];
  return {topic:'Nhân số hữu tỉ',vi:'Tính: &nbsp;'+expr,en:'Calculate: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:st,_v:r};}
function gDiv(){
  var a=rf(9),b=rf(9),ib=inv(b),r=dvd(a,b),rn=a.n*ib.n,rd=a.d*ib.d,expr=H(a)+' : '+HP(b);
  var o=mkOpts(fi(r),[fi(mul(a,b)),fi(neg(r)),fi(inv(r))],fracFiller(r));
  return {topic:'Chia số hữu tỉ',vi:'Tính: &nbsp;'+expr,en:'Calculate: &nbsp;'+expr,opts:o.opts,ans:o.ans,
    steps:['Chia cho một số = nhân với <b>số nghịch đảo</b> của số đó.','Số nghịch đảo của '+H(b)+' là '+H(ib)+'.',expr+' = '+H(a)+' · '+HP(ib)+' = '+fh(rn,rd)+(gcd(rn,rd)>1?' = '+H(r):'')+'.','Đáp án: <b>'+H(r)+'</b>.'],_v:r};}
function gRecip(){
  var x=rf(9),r=inv(x),o=mkOpts(fi(r),[fi(neg(x)),fi(neg(r)),fi(x)],fracFiller(r));
  return {topic:'Số nghịch đảo',vi:'Số nghịch đảo của '+H(x)+' là:',en:'The reciprocal of '+H(x)+' is:',opts:o.opts,ans:o.ans,
    steps:['Hai số nghịch đảo có tích bằng 1.','Đổi chỗ tử và mẫu, <b>giữ nguyên dấu</b>.','Kiểm tra: '+H(x)+' · '+HP(r)+' = 1 ✓','Đáp án: <b>'+H(r)+'</b>.'],_v:r};}
function gPow(){
  var base;do{base=F(pick([-3,-2,-1,1,2,3]),pick([2,3,4,5]));}while(base.d===1);
  var e=base.d<=3?pick([2,3]):2,pn=Math.pow(base.n,e),pd=Math.pow(base.d,e),r=F(pn,pd),expr=powH(base,e);
  var o=mkOpts(fi(r),[fi(base),fi(neg(r)),fi(F(pn,base.d)),fi(F(base.n*e,base.d))],fracFiller(r));
  var st=['Lũy thừa của phân số = lũy thừa của tử chia cho lũy thừa của mẫu.',
    expr+' = <span class="fr"><span class="t">'+par(base.n)+'<sup>'+e+'</sup></span><span class="b">'+base.d+'<sup>'+e+'</sup></span></span> = '+H(r)+'.'];
  if(base.n<0)st.push(e%2?'Cơ số âm, số mũ <b>lẻ</b> → kết quả <b>âm</b>.':'Cơ số âm, số mũ <b>chẵn</b> → kết quả <b>dương</b>.');
  st.push('Đáp án: <b>'+H(r)+'</b>.');
  return {topic:'Lũy thừa của số hữu tỉ',vi:'Tính: &nbsp;'+expr,en:'Calculate: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:st,_v:r,_pw:[base,e]};}
function gPowRule(){
  var x=rf(7),t=ri(0,2),m,n,ans,c,expr,rule,mid;
  if(t===0){do{m=ri(2,6);n=ri(2,5);}while(m*n===m+n);ans=m+n;c=[m*n,Math.abs(m-n)||ans+2,ans+1];expr=powH(x,m)+' · '+powH(x,n);
    rule='Nhân hai lũy thừa cùng cơ số: giữ nguyên cơ số, <b>cộng</b> số mũ.';mid=m+' + '+n;}
  else if(t===1){m=ri(5,9);n=ri(2,4);ans=m-n;c=[m+n,m*n,ans+1];expr=powH(x,m)+' : '+powH(x,n);
    rule='Chia hai lũy thừa cùng cơ số (khác 0): giữ nguyên cơ số, <b>trừ</b> số mũ.';mid=m+' − '+n;}

function ab(x){return F(Math.abs(x.n),x.d);}
function sgn(v){return (v.n<0?' − ':' + ')+H(ab(v));}
function xpm(b){return '(x'+sgn(b)+')';}
function sdiv(a,b){return b&&b.n!==0?dvd(a,b):null;}
function divLine(r,k,x){return H(r)+' : '+HP(k)+' = '+H(r)+' · '+HP(inv(k))+' = '+H(x);}
function bA(a,b,c){
  var y=dvd(c,a),x=sub(y,b),expr=H(a)+' · '+xpm(b)+' = '+H(c);
  var s=['Coi '+xpm(b)+' là thừa số chưa biết: &nbsp;x'+sgn(b)+' = '+H(c)+' : '+H(a)+'.','x'+sgn(b)+' = '+divLine(c,a,y)+'.'];
  if(b.n>0){s.push('Chuyển '+H(b)+' sang vế phải và đổi dấu: x = '+H(y)+' − '+H(b)+'.');s=s.concat(addCalc(y,b,false).s);}
  else{s.push('Chuyển −'+H(ab(b))+' sang vế phải và đổi dấu: x = '+H(y)+' + '+H(ab(b))+'.');s=s.concat(addCalc(y,ab(b),true).s);}
  s.push('Vậy <b>x = '+H(x)+'</b>.');
  var o=mkOpts(fi(x),[fi(add(y,b)),fi(sub(mul(c,a),b)),fi(sub(c,b)),fi(neg(x))],fracFiller(x));
  return {topic:'Tìm x: a·(x ± b) = c',vi:'Tìm x, biết: &nbsp;'+expr,en:'Find x: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:s,_k:['A',[a,b,c],x]};}
function bB(a,b,c){
  var k=add(a,b),x=dvd(c,k),expr=H(a)+' · x'+sgn(b)+' · x = '+H(c);
  var s=['Đặt x làm nhân tử chung: &nbsp;('+H(a)+sgn(b)+') · x = '+H(c)+'.'];
  s=s.concat(addCalc(a,ab(b),b.n>0).s);
  s.push('Ta có '+H(k)+' · x = '+H(c)+' &nbsp;⇒&nbsp; x = '+divLine(c,k,x)+'.');
  s.push('Vậy <b>x = '+H(x)+'</b>.');
  var o=mkOpts(fi(x),[fi(sdiv(c,sub(a,b))),fi(mul(c,k)),fi(sub(c,k)),fi(neg(x))],fracFiller(x));
  return {topic:'Tìm x: a·x ± b·x = c',vi:'Tìm x, biết: &nbsp;'+expr,en:'Find x: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:s,_k:['B',[a,b,c],x]};}
function bC(a,b,c,d){
  var m=mul(a,b),k=add(a,c),r=sub(d,m),x=dvd(r,k),expr=H(a)+' · '+xpm(b)+sgn(c)+' · x = '+H(d);
  var s=['Phá ngoặc ('+H(a)+' · '+HP(b)+' = '+H(m)+'): &nbsp;'+H(a)+' · x'+sgn(m)+sgn(c)+' · x = '+H(d)+'.',
    'Gom các hạng tử chứa x, chuyển số sang vế phải (đổi dấu): &nbsp;('+H(a)+sgn(c)+') · x = '+H(d)+sgn(neg(m))+'.'];
  s=s.concat(addCalc(a,ab(c),c.n>0).s).concat(addCalc(d,ab(m),m.n<0).s);
  s.push('Ta có '+H(k)+' · x = '+H(r)+' &nbsp;⇒&nbsp; x = '+divLine(r,k,x)+'.');
  s.push('Vậy <b>x = '+H(x)+'</b>.');
  var o=mkOpts(fi(x),[fi(sdiv(sub(d,b),k)),fi(sdiv(add(d,m),k)),fi(sdiv(r,sub(a,c))),fi(neg(x))],fracFiller(x));
  return {topic:'Tìm x: phá ngoặc, gom x',vi:'Tìm x, biết: &nbsp;'+expr,en:'Find x: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:s,_k:['C',[a,b,c,d],x]};}
function bD(a,p,b,q){
  var ap=mul(a,p),bq=mul(b,q),k=sub(a,b),r=sub(bq,ap),x=dvd(r,k),expr=H(a)+' · '+xpm(p)+' = '+H(b)+' · '+xpm(q);

    'Chuyển hạng tử chứa x sang vế trái, số sang vế phải (đổi dấu): &nbsp;'+H(a)+' · x − '+H(b)+' · x = '+H(bq)+sgn(neg(ap))+'.'];
  s=s.concat(addCalc(a,b,false).s).concat(addCalc(bq,ab(ap),ap.n<0).s);
  s.push('Ta có '+H(k)+' · x = '+H(r)+' &nbsp;⇒&nbsp; x = '+divLine(r,k,x)+'.');
  s.push('Vậy <b>x = '+H(x)+'</b>.');
  var o=mkOpts(fi(x),[fi(sdiv(sub(ap,bq),k)),fi(sdiv(sub(q,p),k)),fi(sdiv(r,add(a,b))),fi(neg(x))],fracFiller(x));
  return {topic:'Tìm x: x ở hai vế',vi:'Tìm x, biết: &nbsp;'+expr,en:'Find x: &nbsp;'+expr,opts:o.opts,ans:o.ans,steps:s,_k:['D',[a,p,b,q],x]};}
function posF(maxD){var x;do{x=F(ri(1,9),ri(2,maxD||10));}while(x.d===1);return x;}
function niceX(){return Math.random()<0.35?F(pick([-2,-1,1,2,3,4,5]),1):F(pick([-3,-2,-1,1,2,3,4,5,7]),pick([2,3,4,5,6]));}

function gXA(){var a,b,c,x,t=0;do{a=posF(9);b=rf(10);x=niceX();c=mul(a,add(x,b));t++;}while(t<300&&!(c.n>0&&small(c,30,30)));return bA(a,b,c);}

function vkey(D,w){return D.id+':'+w[0];}
function grade(D,w,ok){var k=vkey(D,w),s=S.vocab[k]||{b:0};s.b=ok?Math.min(s.b+1,5):1;s.due=addDays(ok?INT[s.b]:0);S.vocab[k]=s;}
function pickWords(D,n){var t=today(),due=[],fresh=[],rest=[];
  D.words.forEach(function(w,i){var s=S.vocab[vkey(D,w)];if(!s)fresh.push(i);else if(s.due<=t)due.push(i);else rest.push(i);});
  return shuffle(due).concat(shuffle(fresh)).concat(shuffle(rest)).slice(0,n);}
function deckStat(D){var t=today(),l=0,d=0;D.words.forEach(function(w){var s=S.vocab[vkey(D,w)];if(s){if(s.b>=3)l++;if(s.due<=t)d++;}});return {learned:l,due:d};}

function prepFixed(f){var idx=[];for(var i=0;i<f.opts.length;i++)idx.push(i);shuffle(idx);
  return {topic:f.topic,vi:f.vi,en:f.en,opts:idx.map(function(j){return f.opts[j];}),optsEn:f.optsEn?idx.map(function(j){return f.optsEn[j];}):null,ans:idx.indexOf(f.ans),steps:f.steps,src:f};}
function buildLevel(i){var L=LEVELS[i],list=[],nf=Math.min(L.fixed.length,L.id==='L6'?3:2);
  if(L.bank)shuffle(L.bank.slice()).slice(0,L.nb).forEach(function(it){var q=it.fn.apply(null,it.args);q.gen=it.gen;q.tag='📄 Phiếu câu '+it.no;list.push(q);});
  shuffle(L.fixed.slice()).slice(0,nf).forEach(function(f){list.push(prepFixed(f));});
  while(list.length<L.n){var g=pick(L.gens),q=g();q.gen=g;list.push(q);}
  return shuffle(list);}
function startLevel(i){Q={lv:i,list:buildLevel(i),i:0,base:0,ok:0,xp:0,retries:0,answered:false};Q.base=Q.list.length;renderQuiz();window.scrollTo(0,0);}

function renderQuiz(){
  var q=Q.list[Q.i],en=S.lang==='en',L=LEVELS[Q.lv],opts=(en&&q.optsEn)?q.optsEn:q.opts,pct=Math.round(Q.i/Q.list.length*100);
  var h='<div class="bar"><span class="back" data-act="map">✕</span><span class="bt">'+L.icon+' '+L.name+'</span><span class="pill on" data-act="togglelang">'+(en?'🇬🇧 EN':'🇻🇳 VI')+'</span></div>';
  h+='<div class="prog"><div style="width:'+pct+'%;background:'+S.color+'"></div></div><div class="muted">Câu '+(Q.i+1)+'/'+Q.list.length+(q.retry?' · 🔁 Luyện lại':'')+(q.tag?' · '+q.tag:'')+' · '+q.topic+'</div>';
  h+='<div class="card q">'+fmt(en?q.en:q.vi);
  if(en)h+=Q.showVi?'<div class="vi">🇻🇳 '+fmt(q.vi)+'</div>':'<div class="small" data-act="showvi">🇻🇳 Xem đề tiếng Việt</div>';
  h+='</div><div class="opts">';
  for(var i=0;i<opts.length;i++){var cls='opt';
    if(Q.answered){if(i===q.ans)cls+=' ok';else if(i===Q.chosen)cls+=' bad';else cls+=' dim';}
    h+='<div class="'+cls+'"'+(Q.answered?'':' data-act="ans" data-arg="'+i+'"')+'>'+fmt(opts[i])+'</div>';}
  h+='</div>';

    if(Q.chosen===q.ans)h+='<div class="fb good"><div class="fbt pop">'+Q.praise+'</div>'+(Q.showSteps?stepsHtml(q):'<div class="small" data-act="steps">Xem cách giải</div>')+'</div>';
    else h+='<div class="fb badfb"><div class="fbt">Chưa đúng rồi, cùng xem cách giải nhé 👇</div>'+stepsHtml(q)+(Q.added?'<div class="muted">Cuối màn bạn sẽ được làm thêm một câu tương tự để luyện lại.</div>':'')+'</div>';
    h+='<div class="center"><span class="btn" data-act="next" style="background:'+S.color+'">Tiếp tục →</span></div>';}
  render(h);
  if(Q.answered){var fb=document.querySelector('.fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView(false);}}
function answer(i){
  if(Q.answered)return;var q=Q.list[Q.i],ok=i===q.ans;
  Q.answered=true;Q.chosen=i;Q.showSteps=false;Q.added=false;Q.praise=pick(PRAISE);
  var ts=S.ts[q.topic]||{ok:0,n:0};ts.n++;if(ok)ts.ok++;S.ts[q.topic]=ts;
  if(ok){Q.xp+=q.retry?5:10;if(!q.retry)Q.ok++;}
  else{
    S.wrong.unshift({d:today(),t:q.topic,q:q.vi,a:q.opts[q.ans],c:q.opts[i]});if(S.wrong.length>40)S.wrong.length=40;
    if(Q.retries<4){Q.retries++;var nq=q.gen?q.gen():prepFixed(q.src);nq.gen=q.gen;nq.retry=true;Q.list.push(nq);Q.added=true;}}
  save();renderQuiz();}

  S.xp+=Q.xp;markDay('math');save();

  var h='<div class="card center"><div class="res pop">'+stars(st)+'</div><div class="h1">'+msg+'</div>'+

  h+='</div><div class="card"><div class="h2">Câu làm sai gần đây</div>';
  if(!S.wrong.length)h+='<div class="muted">Chưa có câu sai nào.</div>';
  S.wrong.slice(0,15).forEach(function(w){h+='<div class="wq"><div class="muted">'+w.d.split('-').reverse().join('/')+' · '+w.t+'</div>'+fmtVi(w.q)+'<br>Bé chọn: <span style="color:#ef4444">'+fmtVi(w.c)+'</span> &nbsp;·&nbsp; Đúng: <span style="color:#10b981">'+fmtVi(w.a)+'</span></div>';});
  h+='</div><div class="card"><div class="h2">Tiếng Anh</div>';
  DECKS.forEach(function(D){var st=deckStat(D);h+='<p>'+D.icon+' '+D.name+': đã thuộc <b>'+st.learned+'/'+D.words.length+'</b> · cần ôn hôm nay: '+st.due+'</p>';});
  h+='</div><div class="card"><div class="h2">Phần thưởng & cài đặt</div>'+
    '<p>Phần thưởng hiển thị cho bé (ví dụ: "Đủ 7 ngày liên tục → đi ăn kem"):</p><input id="goal" class="inp" style="max-width:100%" value="'+esc(S.goal)+'">'+
    '<p>Tên của bé:</p><input id="nm" class="inp" maxlength="20" value="'+esc(S.name)+'"><p>Nhân vật</p><div>'+avPicker()+'</div><p>Màu</p><div>'+clPicker()+'</div>'+
    '<br><span class="btn" data-act="psave">💾 Lưu</span><span class="btn ghost" data-act="resetpin">Đổi PIN</span><span class="btn red" data-act="reset">'+(P.reset?'Bấm lần nữa để XÓA HẾT':'Xóa toàn bộ dữ liệu')+'</span></div>';
  render(h);}

/* ---------- điều khiển ---------- */
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function pickOn(sel,arg){var els=document.querySelectorAll(sel);for(var i=0;i<els.length;i++){var on=els[i].getAttribute('data-arg')===arg;els[i].className=els[i].className.replace(' on','')+(on?' on':'');}}
var ACT={
  home:function(){home();window.scrollTo(0,0);},
  map:function(){map();window.scrollTo(0,0);},
  eng:function(){eng();window.scrollTo(0,0);},
  gate:function(){gate();},
  start:function(){var n=val('nm').replace(/^\s+|\s+$/g,'');if(!n){document.getElementById('nm').focus();return;}S.name=n;save();home();},
  av:function(a){S.avatar=a;pickOn('.av',a);save();},
  cl:function(c){S.color=c;pickOn('.cl',c);save();},
  setlang:function(l){S.lang=l;save();map();},
  togglelang:function(){S.lang=S.lang==='en'?'vi':'en';Q.showVi=false;save();renderQuiz();},
  showvi:function(){Q.showVi=true;renderQuiz();},
  steps:function(){Q.showSteps=true;renderQuiz();},
  play:function(i){startLevel(+i);},
  ans:function(i){answer(+i);},
  next:function(){nextQ();},
  flash:function(i){startFlash(+i);window.scrollTo(0,0);},
  flip:function(){V.flipped=!V.flipped;renderFlash();},
  fgrade:function(v){fgrade(v==='1');},
  say:function(t){speak(decodeURIComponent(t));},
  vquiz:function(i){startVQ(+i);window.scrollTo(0,0);},
  vans:function(i){vans(+i);},
  vnext:function(){vnext();},
  setpin:function(){var p=val('pin');if(!/^\d{4}$/.test(p))return;S.pin=p;save();P.reset=false;parent();},
  checkpin:function(){if(val('pin')===S.pin){P.reset=false;parent();window.scrollTo(0,0);}else{var e=document.getElementById('pinerr');if(e)e.innerHTML='Sai mã PIN';}},
  resetpin:function(){S.pin='';save();gate();},
  psave:function(){var n=val('nm').replace(/^\s+|\s+$/g,'');if(n)S.name=n;S.goal=val('goal');save();parent();},
  reset:function(){if(!P.reset){P.reset=true;parent();return;}S=defState();save();P.reset=false;home();}
};
document.addEventListener('click',function(e){
  var t=e.target;while(t&&t.getAttribute&&!t.getAttribute('data-act'))t=t.parentNode;
  if(!t||!t.getAttribute)return;var f=ACT[t.getAttribute('data-act')];if(f)f(t.getAttribute('data-arg'));});

/* ---------- đếm thời gian học (chỉ khi đang dùng) ---------- */
var lastAct=Date.now(),tick=0;
function poke(){lastAct=Date.now();}
document.addEventListener('touchstart',poke,true);document.addEventListener('click',poke,true);
setInterval(function(){if(document.hidden||Date.now()-lastAct>60000||!S.name)return;var k=today();S.time[k]=(S.time[k]||0)+5;if(++tick%6===0)save();},5000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);

load();home();
window.__DT={bA:bA,bB:bB,bC:bC,bD:bD,BANKS:BANK_A.concat(BANK_B,BANK_C,BANK_D),F:F,add:add,sub:sub,mul:mul,dvd:dvd,inv:inv,neg:neg,key:key,ALLG:ALLG,LEVELS:LEVELS,buildLevel:buildLevel,DECKS:DECKS};
})();
</script>
